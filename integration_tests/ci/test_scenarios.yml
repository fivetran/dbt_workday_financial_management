# dbt_adapter_versions:
#   snowflake: ">=1.3.0,<2.0.0"
#   bigquery: ">=1.3.0,<2.0.0"
#   postgres: ">=1.3.0,<2.0.0"
#   redshift: ">=1.3.0,<2.0.0"
#   databricks: ">=1.6.0,<2.0.0"

schema_variable_name: "workday_financial_management_schema"

include_databricks_sql: false
include_sqlserver: false
include_dbt_compile: true

test_scenarios:
  - name: "Default"
    vars: {}
    include_incremental: false

  # The Default scenario names no worktag types, so it already covers the empty path: the pivot is
  # not built and the general ledger carries no worktag columns. This scenario covers the other
  # side -- the pivot builds, and Organization_Reference_ID exercises the listagg that holds
  # several values on one line.
  - name: "Worktag types configured"
    vars:
      workday_financial_management__worktag_types: ['Organization_Reference_ID', 'Cost_Center_Reference_ID', 'Region_Reference_ID', 'Spend_Category_ID', 'Revenue_Category_ID', 'Campaign']
      workday_financial_management__budget_worktag_types: ['Cost_Center_Reference_ID', 'Spend_Category_ID', 'Revenue_Category_ID']
    include_incremental: false

  # Seed data carries one UNPOSTED entry alongside 169 POSTED ones, so widening this actually
  # changes the general ledger's row count under CI.
  - name: "Posted statuses widened"
    vars:
      workday_financial_management__posted_statuses: ['POSTED', 'UNPOSTED']
    include_incremental: false

  - name: "MDLS"
    vars:
      fivetran_using_source_casing: true
    include_incremental: false
    include_dbt_seed: true
