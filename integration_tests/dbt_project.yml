name: 'workday_financial_management_integration_tests'
version: '0.1.0'
config-version: 2
profile: 'integration_tests'

vars:
  workday_financial_management_database: singular-vector-135519
  workday_financial_management_schema: wfm_initial_sync
  # Exercises both halves of the pivot beyond the hardcoded defaults. Location_ID and Project_ID
  # come from the worktag dimension in both the seeds and the source; Campaign and
  # Line_of_Business are the seeds' custom_worktag codes, Flow_Code and Worktag_Custom_10 the
  # source's. A type absent from whichever is in use just yields a null column.
  workday_financial_management__worktag_types: ['Company_Reference_ID', 'Location_ID', 'Project_ID', 'Campaign', 'Line_of_Business', 'Flow_Code', 'Worktag_Custom_11']
  # workday_financial_management:
  #   workday_financial_management_schema: zz_dbt_savage
  #   workday_financial_management_journal_entry_identifier: "journal_entry"
  #   workday_financial_management_journal_entry_line_identifier: "journal_entry_line"
  #   workday_financial_management_journal_entry_line_worktag_identifier: "journal_entry_line_worktag"
  #   workday_financial_management_worktag_identifier: "worktag"
  #   workday_financial_management_custom_worktag_identifier: "custom_worktag"
  #   workday_financial_management_ledger_identifier: "ledger"
  #   workday_financial_management_ledger_account_identifier: "ledger_account"
  #   workday_financial_management_journal_source_identifier: "journal_source"
  #   workday_financial_management_company_identifier: "company"
  #   workday_financial_management_currency_identifier: "currency"

models:
  +persist_docs:
    relation: true
    columns: "{{ false if target.type in ('databricks') else true }}"
  workday_financial_management:
   # +schema: "{{ 'workday_financial_management_integrations_tests_sqlw' if target.name == 'databricks-sql' else 'workday_financial_management' }}"
    +schema: "workday_financial_management_{{ var('directed_schema','dev') }}" ## To be used for validation tests

seeds:
  +docs:
    show: False
  workday_financial_management_integration_tests:
    +column_types:
      _fivetran_synced: timestamp
      _fivetran_deleted: boolean
    journal_entry:
      +column_types:
        accounting_date: date
        transaction_date: date
        creation_date: timestamp
        journal_sequence_number: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        total_ledger_debits: "{{ 'float64' if target.type == 'bigquery' else 'float' }}"
        total_ledger_credits: "{{ 'float64' if target.type == 'bigquery' else 'float' }}"
    journal_entry_line:
      +column_types:
        index: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        line_order: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        journal_line_number: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
        debit_amount: "{{ 'float64' if target.type == 'bigquery' else 'float' }}"
        credit_amount: "{{ 'float64' if target.type == 'bigquery' else 'float' }}"
        ledger_debit_amount: "{{ 'float64' if target.type == 'bigquery' else 'float' }}"
        ledger_credit_amount: "{{ 'float64' if target.type == 'bigquery' else 'float' }}"
        currency_rate: "{{ 'float64' if target.type == 'bigquery' else 'float' }}"
        quantity: "{{ 'float64' if target.type == 'bigquery' else 'float' }}"
        budget_date: date
        exclude_from_spend_report: boolean
    journal_entry_line_worktag:
      +column_types:
        journal_entry_line_index: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"
    custom_worktag:
      +column_types:
        inactive: boolean
    ledger_account:
      +column_types:
        retired: boolean
    company:
      +column_types:
        organization_active: boolean
        reverse_debit_credit: boolean
        keep_debit_credit_and_reverse_sign: boolean
    currency:
      +column_types:
        precision: "{{ 'int64' if target.type == 'bigquery' else 'bigint' }}"

dispatch:
  - macro_namespace: dbt_utils
    search_order: ['spark_utils', 'dbt_utils']

flags:
  send_anonymous_usage_stats: False
  use_colors: True
