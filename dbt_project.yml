name: 'workday_financial_management'
version: '0.1.0'

config-version: 2
require-dbt-version: [">=1.3.0", "<3.0.0"]

models:
  workday_financial_management:
    +schema: workday_financial_management_reports
    +materialized: table
    staging:
      +schema: workday_financial_management_staging
      +materialized: view
      tmp:
        +schema: workday_financial_management_staging
        +materialized: view
    intermediate:
      +schema: workday_financial_management_intermediate
      +materialized: ephemeral

vars:
  workday_financial_management_sources: []

  # Journal entry statuses that count as posted. Only these reach the end models -- canceled and
  # errored entries otherwise contaminate every balance. Widen it only if you use
  # different status values; the staging models always carry the full journal history.
  workday_financial_management__posted_statuses: ['POSTED']

  # Worktag types to add as columns on the general ledger. No type is included by default, so the
  # general ledger carries no worktag columns until you name one here. Values must match your
  # worktag table's attribute -- or, for custom worktags, your custom_worktag table's
  # configuration_code -- and are matched case-insensitively.
  workday_financial_management__worktag_types: []

  # Worktag types to add to the budget vs actuals grain. No type is included by default. Unlike the
  # general ledger, a type named here is part of the key, so it splits a budget row away from the
  # actual it would otherwise have paired with wherever only one side records it. Organization
  # worktag types are refused, because Workday lets a line carry several at once.
  workday_financial_management__budget_worktag_types: []

  # Gates the two fiscal calendar source tables: fiscal_period and fiscal_year. Set to false if you
  # do not sync them, which drops the fiscal_* columns from the general ledger. Budget vs actuals
  # is grained on fiscal periods, so it is disabled along with them.
  workday_financial_management_using_fiscal_calendar: true

  # Gates the three business plan source tables, which is where Workday stores budgets:
  # business_plan_detail, business_plan_entry_line, and business_plan_entry_line_worktag. Set to
  # false to disable their staging models and the budget vs actuals model.
  workday_financial_management_using_business_plans: true
